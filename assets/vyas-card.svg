<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 422" width="880" height="422" role="img" aria-label="Vyas Room Booking, flagship project"><title>Vyas Room Booking, flagship project</title><desc>Full-stack room booking platform for MIT World Peace University. 51+ features, 40+ API endpoints.</desc><defs><clipPath id="c"><rect width="880" height="422" rx="16"/></clipPath><radialGradient id="glow" cx="809.6" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><rect width="880" height="422" rx="16" fill="#10161d"/><rect width="880" height="422" fill="url(#glow)" clip-path="url(#c)"/><text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.4">Vyas Room Booking</text><circle cx="832" cy="52" r="15.5" fill="#0b1015" stroke="#2f3742"/><g transform="translate(822 42)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></g><rect x="655.2" y="40" width="148.8" height="24" rx="12" fill="#3a2e0f"/><text x="729.6" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e3b341" text-anchor="middle" letter-spacing="1.2">FLAGSHIP PROJECT</text><rect x="32" y="88" width="59" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="61.5" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">React</text><rect x="99" y="88" width="96" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="147" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">TypeScript</text><rect x="203" y="88" width="88.6" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="247.3" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Express 5</text><rect x="299.6" y="88" width="96" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="347.6" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">PostgreSQL</text><rect x="403.6" y="88" width="59" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="433.1" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Redis</text><rect x="470.6" y="88" width="88.6" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="514.9" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Socket.IO</text><text x="32" y="153.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">A full-stack room booking platform built for MIT World Peace University. Faculty browse the building</text><text x="32" y="177.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">floor by floor, see a live weekly calendar for any room, find a free room for a given time slot and book</text><text x="32" y="201.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">it in a few clicks. Everyone else&#x27;s calendar updates in real time while they do. Administrators manage</text><text x="32" y="225.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">the rooms, approve bookings for restricted spaces and maintain the semester timetable.</text><text x="32" y="261.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">It started on Supabase and was moved to a custom Express and PostgreSQL backend, with the migration</text><text x="32" y="285.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">documented. The backend lives in its own repository.</text><rect x="32" y="314" width="264" height="76" rx="10" fill="#0b1015" stroke="#2f3742"/><text x="50" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f0f6fc" text-anchor="start">51+</text><text x="50" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">implemented features</text><rect x="308" y="314" width="264" height="76" rx="10" fill="#0b1015" stroke="#2f3742"/><text x="326" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f0f6fc" text-anchor="start">40+</text><text x="326" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">API endpoints</text><rect x="584" y="314" width="264" height="76" rx="10" fill="#0b1015" stroke="#2f3742"/><text x="602" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f0f6fc" text-anchor="start">1 PRD</text><text x="602" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">product requirements, written up</text><rect x="0.5" y="0.5" width="879" height="421" rx="16" fill="none" stroke="#2f3742"/></svg>
