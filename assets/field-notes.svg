<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Field notes"><title>Field notes</title><desc>Verify the code, not the changelog. Defaults are decisions. Treat a great number as a bug report.</desc><defs><clipPath id="c"><rect width="880" height="290" rx="16"/></clipPath><radialGradient id="glow" cx="809.6" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="281.667" height="289" rx="16" fill="#10161d" stroke="#2f3742"/><circle cx="38" cy="38" r="14" fill="#0b1015" stroke="#5eead4"/><text x="38" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5eead4" text-anchor="middle">01</text><text x="62" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="1.4">FIELD NOTE</text><text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.2">Verify the code, not</text><text x="24" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.2">the changelog.</text><text x="24" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">An audit of one of my own</text><text x="24" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">projects showed that a round of</text><text x="24" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">fixes I had recorded as done was</text><text x="24" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">not in the code. I now check</text><text x="24" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">with a grep and a test before I</text><text x="24" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">believe a status line.</text><rect x="299.167" y="0.5" width="281.667" height="289" rx="16" fill="#10161d" stroke="#2f3742"/><circle cx="336.667" cy="38" r="14" fill="#0b1015" stroke="#5eead4"/><text x="336.667" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5eead4" text-anchor="middle">02</text><text x="360.667" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="1.4">FIELD NOTE</text><text x="322.667" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.2">Defaults are decisions.</text><text x="322.667" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">A tie-break that quietly</text><text x="322.667" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">resolves to &quot;drivable terrain&quot;</text><text x="322.667" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">over &quot;dynamic object&quot; is a</text><text x="322.667" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">safety policy, not a detail. I</text><text x="322.667" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">write those choices down.</text><rect x="597.833" y="0.5" width="281.667" height="289" rx="16" fill="#10161d" stroke="#2f3742"/><circle cx="635.333" cy="38" r="14" fill="#0b1015" stroke="#5eead4"/><text x="635.333" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#5eead4" text-anchor="middle">03</text><text x="659.333" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="1.4">FIELD NOTE</text><text x="621.333" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.2">Treat a great number as</text><text x="621.333" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.2">a bug report.</text><text x="621.333" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">A surprisingly good compression</text><text x="621.333" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">ratio gets reconciled against an</text><text x="621.333" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">independent run before it goes</text><text x="621.333" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">in a write-up.</text></svg>
