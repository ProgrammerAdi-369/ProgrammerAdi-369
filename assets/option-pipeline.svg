<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358" width="880" height="358" role="img" aria-label="Option Mispricing Pipeline"><title>Option Mispricing Pipeline</title><desc>Pipeline: NSE option chain, clean and implied vol, features, XGBoost fair value, z-score, buy/sell signals, Streamlit review, with walk-forward retraining back into the model.</desc><defs><clipPath id="c"><rect width="880" height="358" rx="16"/></clipPath><radialGradient id="glow" cx="809.6" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><rect width="880" height="358" rx="16" fill="#10161d"/><rect width="880" height="358" fill="url(#glow)" clip-path="url(#c)"/><text x="32" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">Option Mispricing Pipeline</text><circle cx="832" cy="46" r="15.5" fill="#0b1015" stroke="#2f3742"/><g transform="translate(822 36)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></g><rect x="32" y="76" width="66.4" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="65.2" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Python</text><rect x="106.4" y="76" width="73.8" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="143.3" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">XGBoost</text><rect x="188.2" y="76" width="59" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="217.7" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">SciPy</text><rect x="255.2" y="76" width="88.6" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="299.5" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Streamlit</text><text x="32" y="137.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">Detects mispriced BANKNIFTY options from raw NSE option-chain data. Signals come from cross-sectional</text><text x="32" y="161.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">z-scores of how far each contract sits from a model&#x27;s fair value. A walk-forward retraining layer keeps</text><text x="32" y="185.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">the model current as the market changes, and a seven-layer accuracy analysis checks the result.</text><rect x="32" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#2f3742"/><text x="82.5714" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">NSE option</text><text x="82.5714" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">chain</text><path d="M136.143 252.0 H146.143" stroke="#9198a1" stroke-width="1.5"/><path d="M143.143 248.5 L148.143 252.0 L143.143 255.5" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="151.143" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#2f3742"/><text x="201.714" y="240.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">Clean +</text><text x="201.714" y="255.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">implied vol</text><text x="201.714" y="270.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">(brentq)</text><path d="M255.286 252.0 H265.286" stroke="#9198a1" stroke-width="1.5"/><path d="M262.286 248.5 L267.286 252.0 L262.286 255.5" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="270.286" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#2f3742"/><text x="320.857" y="240.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">Volatility and</text><text x="320.857" y="255.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">liquidity</text><text x="320.857" y="270.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">features</text><path d="M374.429 252.0 H384.429" stroke="#9198a1" stroke-width="1.5"/><path d="M381.429 248.5 L386.429 252.0 L381.429 255.5" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="389.429" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#5eead4"/><text x="440" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#f0f6fc" text-anchor="middle">XGBoost fair</text><text x="440" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#f0f6fc" text-anchor="middle">value</text><path d="M493.571 252.0 H503.571" stroke="#9198a1" stroke-width="1.5"/><path d="M500.571 248.5 L505.571 252.0 L500.571 255.5" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="508.571" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#2f3742"/><text x="559.143" y="240.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle"></text><text x="559.143" y="255.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">Cross-sectional</text><text x="559.143" y="270.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">z-score</text><path d="M612.714 252.0 H622.714" stroke="#9198a1" stroke-width="1.5"/><path d="M619.714 248.5 L624.714 252.0 L619.714 255.5" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="627.714" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#5eead4"/><text x="678.286" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#f0f6fc" text-anchor="middle">BUY / SELL</text><text x="678.286" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#f0f6fc" text-anchor="middle">signals</text><path d="M731.857 252.0 H741.857" stroke="#9198a1" stroke-width="1.5"/><path d="M738.857 248.5 L743.857 252.0 L738.857 255.5" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="746.857" y="218" width="101.143" height="68" rx="9" fill="#0b1015" stroke="#2f3742"/><text x="797.429" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">Streamlit</text><text x="797.429" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f0f6fc" text-anchor="middle">review</text><path d="M678.286 286 V316 H440 V293" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M435.5 297 L440 289 L444.5 297" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linejoin="round"/><rect x="483.143" y="306" width="152" height="20" fill="#10161d"/><text x="559.143" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">walk-forward retrain</text><rect x="0.5" y="0.5" width="879" height="357" rx="16" fill="none" stroke="#2f3742"/></svg>
