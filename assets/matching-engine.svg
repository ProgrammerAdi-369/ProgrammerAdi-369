<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 442" width="880" height="442" role="img" aria-label="Low-Latency Order Matching Engine"><title>Low-Latency Order Matching Engine</title><desc>C++17 matching engine with price-time priority. 10,000-order stress test: about 5.2M orders per second, 0.19 microsecond average latency, 0.8 microsecond P99.</desc><defs><clipPath id="c"><rect width="880" height="442" rx="16"/></clipPath><radialGradient id="glow" cx="809.6" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><rect width="880" height="442" rx="16" fill="#10161d"/><rect width="880" height="442" fill="url(#glow)" clip-path="url(#c)"/><text x="32" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">Low-Latency Order Matching Engine</text><circle cx="516" cy="46" r="15.5" fill="#0b1015" stroke="#2f3742"/><g transform="translate(506 36)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></g><rect x="32" y="76" width="59" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="61.5" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">C++17</text><rect x="99" y="76" width="59" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="128.5" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">CMake</text><text x="32" y="137.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">An NSE/BSE-style matching engine with price-time priority</text><text x="32" y="161.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">(FIFO). It handles limit and market orders, partial fills,</text><text x="32" y="185.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">multi-level cascading matches and O(1) lazy cancellation. It</text><text x="32" y="209.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">ships with ten scenario tests that cover the edge cases, plus a</text><text x="32" y="233.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" text-anchor="start">latency and throughput analyzer.</text><rect x="32" y="254" width="500" height="156" rx="12" fill="#0b1015" stroke="#2f3742"/><rect x="241" y="348.026" width="14" height="17.9742" rx="2" fill="#5eead4" opacity="0.35"/><rect x="309" y="351.678" width="14" height="14.3221" rx="2" fill="#e3b341" opacity="0.35"/><rect x="223" y="344.273" width="14" height="21.7266" rx="2" fill="#5eead4" opacity="0.39"/><rect x="327" y="339.755" width="14" height="26.2449" rx="2" fill="#e3b341" opacity="0.39"/><rect x="205" y="333.419" width="14" height="32.581" rx="2" fill="#5eead4" opacity="0.43"/><rect x="345" y="335.28" width="14" height="30.7203" rx="2" fill="#e3b341" opacity="0.43"/><rect x="187" y="329.409" width="14" height="36.591" rx="2" fill="#5eead4" opacity="0.47"/><rect x="363" y="331.673" width="14" height="34.3269" rx="2" fill="#e3b341" opacity="0.47"/><rect x="169" y="327.439" width="14" height="38.5605" rx="2" fill="#5eead4" opacity="0.51"/><rect x="381" y="319.245" width="14" height="46.7548" rx="2" fill="#e3b341" opacity="0.51"/><rect x="151" y="320.425" width="14" height="45.5751" rx="2" fill="#5eead4" opacity="0.55"/><rect x="399" y="313.224" width="14" height="52.7762" rx="2" fill="#e3b341" opacity="0.55"/><rect x="133" y="308.362" width="14" height="57.6382" rx="2" fill="#5eead4" opacity="0.59"/><rect x="417" y="309.894" width="14" height="56.106" rx="2" fill="#e3b341" opacity="0.59"/><rect x="115" y="305.467" width="14" height="60.5335" rx="2" fill="#5eead4" opacity="0.63"/><rect x="435" y="308.865" width="14" height="57.1354" rx="2" fill="#e3b341" opacity="0.63"/><rect x="97" y="297.818" width="14" height="68.1818" rx="2" fill="#5eead4" opacity="0.67"/><rect x="453" y="295.137" width="14" height="70.8627" rx="2" fill="#e3b341" opacity="0.67"/><rect x="79" y="289.295" width="14" height="76.7046" rx="2" fill="#5eead4" opacity="0.71"/><rect x="471" y="292.4" width="14" height="73.6004" rx="2" fill="#e3b341" opacity="0.71"/><rect x="61" y="284.215" width="14" height="81.7846" rx="2" fill="#5eead4" opacity="0.75"/><rect x="489" y="283.707" width="14" height="82.2927" rx="2" fill="#e3b341" opacity="0.75"/><rect x="43" y="279.042" width="14" height="86.9581" rx="2" fill="#5eead4" opacity="0.79"/><rect x="507" y="283.699" width="14" height="82.3007" rx="2" fill="#e3b341" opacity="0.79"/><line x1="46" y1="367" x2="518" y2="367" stroke="#2f3742"/><text x="50" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">BIDS</text><text x="514" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e3b341" text-anchor="end" letter-spacing="1.4">ASKS</text><text x="282" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">price-time priority (FIFO)</text><rect x="564" y="32" width="284" height="378" rx="14" fill="#0b1015" stroke="#2f3742"/><text x="588" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9198a1" text-anchor="start" letter-spacing="1.4">10,000-ORDER STRESS TEST</text><text x="588" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="-2">~5.2M</text><text x="588" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">orders / sec</text><line x1="588" y1="255.0" x2="824" y2="255.0" stroke="#2f3742"/><text x="588" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Average latency</text><text x="824" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="end">~0.19 µs</text><line x1="588" y1="307.0" x2="824" y2="307.0" stroke="#2f3742"/><text x="588" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">P99 latency</text><text x="824" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="end">~0.8 µs</text><rect x="0.5" y="0.5" width="879" height="441" rx="16" fill="none" stroke="#2f3742"/></svg>
