<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 418" width="880" height="418" role="img" aria-label="What I like: problems where speed, data and correctness all have to hold"><title>What I like: problems where speed, data and correctness all have to hold</title><desc>Four kinds of problem: booking without double-booking, fast matching, honest models, accurate maps.</desc><defs><clipPath id="c"><rect width="880" height="418" rx="16"/></clipPath><radialGradient id="glow" cx="809.6" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><rect width="880" height="418" rx="16" fill="#10161d"/><rect width="880" height="418" fill="url(#glow)" clip-path="url(#c)"/><text x="36" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.4">I like problems where speed, data and correctness all</text><text x="36" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.4">have to hold at the same time.</text><rect x="36" y="132" width="193" height="186" rx="12" fill="#151b23" stroke="#2f3742"/><g transform="translate(54 150)" fill="none" stroke="#5eead4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="20" height="18" rx="3"/><path d="M4 12h20M9 3v5M19 3v5M10 18l3 3 5-6"/></g><text x="54" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">BOOKING</text><text x="54" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">A booking system that</text><text x="54" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">can never double-book</text><text x="54" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">a room.</text><rect x="241" y="132" width="193" height="186" rx="12" fill="#151b23" stroke="#2f3742"/><g transform="translate(259 150)" fill="none" stroke="#5eead4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3L6 16h7l-1 9 10-14h-7z"/></g><text x="259" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">MATCHING</text><text x="259" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">A matching engine</text><text x="259" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">that has to be fast.</text><rect x="446" y="132" width="193" height="186" rx="12" fill="#151b23" stroke="#2f3742"/><g transform="translate(464 150)" fill="none" stroke="#5eead4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22l6-9 5 5 8-12"/><path d="M17 6h5v5"/></g><text x="464" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">MODELS</text><text x="464" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">A model that has to</text><text x="464" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">be honest about its</text><text x="464" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">edge.</text><rect x="651" y="132" width="193" height="186" rx="12" fill="#151b23" stroke="#2f3742"/><g transform="translate(669 150)" fill="none" stroke="#5eead4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><circle cx="14" cy="14" r="4"/><path d="M14 2v5M14 21v5M2 14h5M21 14h5"/></g><text x="669" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">MAPPING</text><text x="669" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">A map that has to be</text><text x="669" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">right about what is</text><text x="669" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">in front of a</text><text x="669" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="start">vehicle.</text><text x="36" y="358.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="start">Most of what&#x27;s below is built in the open and documented properly. Each project has a technical write-up in</text><text x="36" y="380.25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9198a1" text-anchor="start">its repo.</text><rect x="0.5" y="0.5" width="879" height="417" rx="16" fill="none" stroke="#2f3742"/></svg>
