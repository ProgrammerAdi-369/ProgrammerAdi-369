<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" role="img" aria-label="MAQOIDS and AVRLM"><title>MAQOIDS and AVRLM</title><desc>MAQOIDS: multi-agent quantitative options system (in progress). AVRLM: adaptive variable-resolution LiDAR mapping for an unmanned ground vehicle.</desc><defs><clipPath id="c"><rect width="880" height="510" rx="16"/></clipPath><radialGradient id="glow" cx="809.6" cy="0" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><clipPath id="cc0"><rect x="0" y="0" width="428" height="510" rx="16"/></clipPath><g clip-path="url(#cc0)"><rect x="0" y="0" width="428" height="510" fill="#10161d"/><rect x="0" y="0" width="428" height="124" fill="#0b1015"/><rect x="24" y="18" width="170" height="40" rx="8" fill="#151b23" stroke="#2f3742"/><text x="38" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f0f6fc" text-anchor="start">Mispricing agent</text><text x="38" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">per-contract · fine</text><rect x="24" y="66" width="170" height="40" rx="8" fill="#151b23" stroke="#2f3742"/><text x="38" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f0f6fc" text-anchor="start">Volatility agent</text><text x="38" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="start">index-level · coarse</text><path d="M194 38 C228 38 228 62 258 62 M194 86 C228 86 228 62 258 62" fill="none" stroke="#9198a1" stroke-width="1.5"/><path d="M253 58 L259 62 L253 66" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linejoin="round"/><rect x="262" y="42" width="98" height="40" rx="8" fill="#151b23" stroke="#5eead4"/><text x="311" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5eead4" text-anchor="middle">Reconcile</text><line x1="0" y1="124" x2="428" y2="124" stroke="#2f3742"/><text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">MAQOIDS</text><rect x="252.2" y="148" width="109.8" height="24" rx="12" fill="#3a2e0f"/><text x="307.1" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#e3b341" text-anchor="middle" letter-spacing="1.2">IN PROGRESS</text><circle cx="388" cy="158" r="15.5" fill="#0b1015" stroke="#2f3742"/><g transform="translate(378 148)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></g><rect x="24" y="190" width="66.4" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="57.2" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Python</text><text x="24" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Multi-Agent Quantitative Options Intelligence &amp;</text><text x="24" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Decision System.</text><text x="24" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">It combines separate agents for option mispricing</text><text x="24" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">and volatility forecasting with a shared data layer,</text><text x="24" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">and is growing market-regime and risk agents. The</text><text x="24" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">interesting part is composition. One agent gives a</text><text x="24" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">coarse, index-level view of volatility, another</text><text x="24" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">gives a fine, per-contract one, and the system has</text><text x="24" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">to reconcile them.</text></g><rect x="0.5" y="0.5" width="427" height="509" rx="16" fill="none" stroke="#2f3742"/><clipPath id="cc1"><rect x="452" y="0" width="428" height="510" rx="16"/></clipPath><g clip-path="url(#cc1)"><rect x="452" y="0" width="428" height="510" fill="#10161d"/><rect x="452" y="0" width="428" height="124" fill="#0b1015"/><defs><pattern id="coarse" width="28" height="28" patternUnits="userSpaceOnUse" x="452"><path d="M28 0H0V28" fill="none" stroke="#2f3742"/></pattern><pattern id="fine" width="7" height="7" patternUnits="userSpaceOnUse" x="666.0" y="62.0"><path d="M7 0H0V7" fill="none" stroke="#5eead4" opacity="0.4"/></pattern></defs><rect x="452" y="0" width="428" height="124" fill="url(#coarse)"/><circle cx="666.0" cy="62.0" r="52" fill="#0b1015"/><circle cx="666.0" cy="62.0" r="52" fill="url(#fine)"/><circle cx="666.0" cy="62.0" r="52" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="661.5" y="57.5" width="9" height="9" transform="rotate(45 666.0 62.0)" fill="#5eead4"/><rect x="464" y="10" width="124" height="18" fill="#0b1015"/><text x="470" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">50 cm · 10–100 m</text><rect x="770" y="96" width="98" height="18" fill="#0b1015"/><text x="862" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5eead4" text-anchor="end">5 cm · 0–10 m</text><line x1="452" y1="124" x2="880" y2="124" stroke="#2f3742"/><text x="476" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#f0f6fc" text-anchor="start" letter-spacing="-0.3">AVRLM</text><circle cx="840" cy="158" r="15.5" fill="#0b1015" stroke="#2f3742"/><g transform="translate(830 148)" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></g><rect x="476" y="190" width="66.4" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="509.2" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Python</text><rect x="550.4" y="190" width="192.2" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="646.5" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Spiking Neural Networks</text><rect x="750.6" y="190" width="88.6" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="794.9" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">Streamlit</text><rect x="476" y="224" width="59" height="26" rx="13" fill="#0b1015" stroke="#2f3742"/><text x="505.5" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#c9d1d9" text-anchor="middle">PyQt6</text><text x="476" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="start">Adaptive Variable-Resolution LiDAR Mapping.</text><text x="476" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">Real-time terrain mapping for an unmanned ground</text><text x="476" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">vehicle. A spiking PointNet++ labels LiDAR points as</text><text x="476" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">drivable, static obstacle or dynamic object. An</text><text x="476" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">event-driven grid then spends resolution where it</text><text x="476" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">matters, with fine cells close to the vehicle and</text><text x="476" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">coarse cells far away, and only updates cells that</text><text x="476" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">actually received spikes. The repo includes two</text><text x="476" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">dashboards, a radar-style operator view and an</text><text x="476" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#c9d1d9" text-anchor="start">energy profiler.</text></g><rect x="452.5" y="0.5" width="427" height="509" rx="16" fill="none" stroke="#2f3742"/></svg>
